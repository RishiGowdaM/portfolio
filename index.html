  <!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RISHI GOWDA | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

<style>
:root{
--card:rgba(30,10,70,.65);
--border:rgba(180,120,255,.25);
--text:#f0e9ff;
--muted:#b9a8ff;
--accent:#8b5cff;
--accent2:#00d4ff;
}

body{
font-family:'Inter',sans-serif;
background:linear-gradient(270deg,#2b0a4a,#07010f,#1a0f3a,#07010f);
background-size:600% 600%;
animation:bgMove 18s ease infinite;
color:var(--text);
overflow-x:hidden;
}

@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

#particles-js{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}

*{margin:0;padding:0;box-sizing:border-box}

.navbar{
position:fixed;
top:0;
width:100%;
background:rgba(7,1,15,.85);
backdrop-filter:blur(14px);
border-bottom:1px solid var(--border);
}

.nav-container{
max-width:1200px;
margin:auto;
padding:14px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:1.4rem;
font-weight:700;
background:linear-gradient(90deg,var(--accent),var(--accent2));
-webkit-background-clip:text;
color:transparent;
}

.nav-links{
display:flex;
gap:16px;
}

.nav-links a{
text-decoration:none;
color:var(--muted);
font-size:.9rem;
}

#themeToggle{
background:none;
border:none;
font-size:18px;
cursor:pointer;
color:white;
}

.hero{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.hero img{
width:240px;
height:240px;
border-radius:50%;
object-fit:cover;
box-shadow:0 0 40px rgba(0,212,255,.6);
margin-bottom:20px;
}

.hero h1{
font-size:3rem;
}

.hero span{
background:linear-gradient(90deg,var(--accent),var(--accent2));
-webkit-background-clip:text;
color:transparent;
}

.tagline{
color:var(--accent2);
margin-top:8px;
}

section{
padding:120px 20px;
}

.container{
max-width:1100px;
margin:auto;
}

.section-title{
text-align:center;
font-size:2.4rem;
margin-bottom:40px;
background:linear-gradient(90deg,var(--accent),var(--accent2));
-webkit-background-clip:text;
color:transparent;
}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:18px;
padding:32px;
}

.skills{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:24px;
}

.skill-title{
display:flex;
justify-content:space-between;
font-size:.85rem;
color:var(--muted);
margin-bottom:6px;
}

.progress{
height:8px;
background:#14082a;
border-radius:6px;
overflow:hidden;
}

.fill{
height:100%;
width:0;
background:linear-gradient(90deg,var(--accent),var(--accent2));
transition:1.5s;
}

.cert-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:24px;
}

.cert-card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:12px;
margin-bottom:12px;
}

.cert-card h3{
font-size:1.1rem;
margin-bottom:5px;
}

.cert-card p{
font-size:.85rem;
color:var(--muted);
}

.contact-item{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:10px;
color:var(--muted);
text-decoration:none;
}

.feedback-form{
display:grid;
gap:12px;
max-width:400px;
margin:auto;
}

.feedback-form input,
.feedback-form textarea{
padding:12px;
border-radius:8px;
border:1px solid var(--border);
background:#14082a;
color:white;
}

.feedback-form button{
padding:12px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,var(--accent),var(--accent2));
color:white;
cursor:pointer;
}

footer{
text-align:center;
padding:20px;
color:var(--muted);
}
</style>

</head>

<body>

<div id="particles-js"></div>

<nav class="navbar">
<div class="nav-container">
<div class="logo">My Portfolio</div>

<div class="nav-links">
<a href="#home">Home</a>
<a href="#about">About</a>
<a href="#skills">Skills</a>
<a href="#certifications">Certifications</a>
<a href="#contact">Contact</a>
<a href="#feedback">Feedback</a>
</div>

<button id="themeToggle">🌙</button>

</div>
</nav>

<section class="hero" id="home">
<div class="container">
<img src="images/rishi.jpg">
<h1>Hi, I'm <span>RISHIB GOWDA M</span></h1>
<p>BCA Student</p>
<div class="tagline">• CLOUD COMPUTING • Python • HTML</div>
</div>
</section>

<section id="about">
<div class="container card">
<h2 class="section-title">About Me</h2>
<p>I am RISHIB GOWDA M, currently pursuing BCA in Cloud Computing at Kristu Jayanti University...</p>
</div>
</section>

<section id="feedback">
<div class="container card">
<h2 class="section-title">Feedback</h2>

<form class="feedback-form" id="feedbackForm">
<input type="text" id="name" placeholder="Your Name" required>
<input type="email" id="email" placeholder="Your Email" required>
<textarea rows="4" id="message" placeholder="Your Feedback" required></textarea>
<button type="submit">Submit Feedback</button>
</form>

<p id="status"></p>

</div>
</section>

<footer>
© 2026 RISHI GOWDA
</footer>

<script>
// FEEDBACK FIXED
document.getElementById("feedbackForm").addEventListener("submit", async function(e){
e.preventDefault();

const name=document.getElementById("name").value;
const email=document.getElementById("email").value;
const message=document.getElementById("message").value;

try{
const res=await fetch("https://portfolio-backend-323w.onrender.com/contact",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({name,email,message})
});

const data=await res.text();
document.getElementById("status").innerText="✅ "+data;
this.reset();

}catch(err){
document.getElementById("status").innerText="❌ Error sending feedback";
}
});
</script>

</body>
</html>
